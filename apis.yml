  name: Jupyter Kernel Messaging Protocol
  description: >-
    WebSocket-based messaging protocol for communication between Jupyter clients and computational kernels.
    Supports code execution, introspection, completion, and rich output over shell, IOPub, stdin, and
    control channels.
  humanURL: https://jupyter-client.readthedocs.io/en/stable/messaging.html
