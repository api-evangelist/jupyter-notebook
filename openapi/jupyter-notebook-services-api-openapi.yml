openapi: 3.2.0
info:
  title: Jupyter Notebook JupyterHub REST Services API
  description: REST API for JupyterHub, the multi-user server for Jupyter notebooks. This API provides endpoints for managing users, groups, services, proxy routes, and the hub itself. JupyterHub spawns, manages, and proxies multiple instances of single-user Jupyter notebook servers.
  version: 5.0.0
  license:
    name: BSD-3-Clause
    url: https://opensource.org/licenses/BSD-3-Clause
  contact:
    name: Jupyter Project
    url: https://jupyterhub.readthedocs.io
    email: jupyter@googlegroups.com
servers:
- url: http://localhost:8000/hub/api
  description: Local JupyterHub server
security:
- token: []
- oAuthToken: []
tags:
- name: Services
paths:
  /services:
    get:
      operationId: listServices
      summary: Jupyter Notebook List services
      description: List all registered JupyterHub services.
      tags:
      - Services
      responses:
        '200':
          description: List of services.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Service'
        '403':
          description: Forbidden.
  /services/{name}:
    get:
      operationId: getService
      summary: Jupyter Notebook Get service details
      description: Get information about a specific service.
      tags:
      - Services
      parameters:
      - name: name
        in: path
        required: true
        description: Service name.
        schema:
          type: string
      responses:
        '200':
          description: Service details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '404':
          description: Service not found.
components:
  schemas:
    Service:
      type: object
      description: A JupyterHub-managed service.
      properties:
        name:
          type: string
          description: Name of the service.
        admin:
          type: boolean
          description: Whether the service has admin access.
        url:
          type:
          - string
          - 'null'
          description: URL where the service is accessible.
        prefix:
          type: string
          description: URL prefix for the service.
        pid:
          type: integer
          description: Process ID if the service is a managed subprocess.
        command:
          type: array
          description: Command to launch the service.
          items:
            type: string
        info:
          type: object
          description: Additional service information.
          additionalProperties: true
        display:
          type: boolean
          description: Whether to display the service in the UI.
      required:
      - name
  securitySchemes:
    token:
      type: apiKey
      in: header
      name: Authorization
      description: API token passed in the Authorization header as 'token <api_token>'.
    oAuthToken:
      type: http
      scheme: bearer
      description: OAuth2 bearer token.
