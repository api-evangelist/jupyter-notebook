openapi: 3.2.0
info:
  title: Jupyter Notebook General API
  license:
    name: BSD-3-Clause
    url: https://opensource.org/licenses/BSD-3-Clause
  version: '1.0'
  description: 'Operations tagged General across 2 of this provider''s published API definitions: jupyter-notebook-rest-api-openapi.yml, jupyterhub-rest-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: http://localhost:8888/api
  description: Local Jupyter Notebook server
- url: http://localhost:8000/hub/api
  description: Local JupyterHub server
tags:
- name: General
  description: General server information and status endpoints.
paths:
  /api:
    get:
      operationId: getApiInfo
      summary: Jupyter Notebook Get API info
      description: Returns the API version and other server information.
      tags:
      - General
      responses:
        '200':
          description: Server API information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiInfo'
      security:
      - token: []
      - tokenHeader: []
    servers:
    - url: http://localhost:8888/api
      description: Local Jupyter Notebook server
  /api/status:
    get:
      operationId: getApiStatus
      summary: Jupyter Notebook Get server status
      description: Returns the status of the notebook server including kernel and session counts.
      tags:
      - General
      responses:
        '200':
          description: Server status information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerStatus'
      security:
      - token: []
      - tokenHeader: []
    servers:
    - url: http://localhost:8888/api
      description: Local Jupyter Notebook server
  /:
    get:
      operationId: getRootInfo
      summary: Jupyter Notebook Get JupyterHub version
      description: Returns the version of the running JupyterHub instance.
      tags:
      - General
      responses:
        '200':
          description: JupyterHub version information.
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                    description: The version of JupyterHub.
      security:
      - token: []
      - oAuthToken: []
    servers:
    - url: http://localhost:8000/hub/api
      description: Local JupyterHub server
  /info:
    get:
      operationId: getInfo
      summary: Jupyter Notebook Get detailed server info
      description: Returns detailed information about the JupyterHub instance including version, Python version, spawner, and authenticator information.
      tags:
      - General
      responses:
        '200':
          description: Detailed JupyterHub server information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HubInfo'
      security:
      - token: []
      - oAuthToken: []
    servers:
    - url: http://localhost:8000/hub/api
      description: Local JupyterHub server
components:
  schemas:
    ServerStatus:
      type: object
      description: Notebook server status information.
      properties:
        started:
          type: string
          format: date-time
          description: Timestamp when the server was started.
        last_activity:
          type: string
          format: date-time
          description: Timestamp of the last activity on the server.
        connections:
          type: integer
          description: Number of active connections.
        kernels:
          type: integer
          description: Number of running kernels.
    ApiInfo:
      type: object
      description: Server API information.
      properties:
        version:
          type: string
          description: API version string.
      required:
      - version
    HubInfo:
      type: object
      description: Detailed JupyterHub server information.
      properties:
        version:
          type: string
          description: JupyterHub version.
        python:
          type: string
          description: Python version.
        sys_executable:
          type: string
          description: Path to the Python executable.
        authenticator:
          type: object
          description: Authenticator information.
          properties:
            class:
              type: string
              description: Fully qualified class name of the authenticator.
            version:
              type: string
              description: Authenticator version.
        spawner:
          type: object
          description: Spawner information.
          properties:
            class:
              type: string
              description: Fully qualified class name of the spawner.
            version:
              type: string
              description: Spawner version.
  securitySchemes:
    token:
      type: apiKey
      in: query
      name: token
      description: Authentication token passed as a query parameter.
    tokenHeader:
      type: apiKey
      in: header
      name: Authorization
      description: Authentication token passed in the Authorization header as 'token <token_value>'.
    oAuthToken:
      type: http
      scheme: bearer
      description: OAuth2 bearer token.
x-refined-from:
- jupyter-notebook-rest-api-openapi.yml
- jupyterhub-rest-api-openapi.yml
